name: Profile languages

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/language_card.py
      - .github/workflows/profile-languages.yml
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

# Both generators publish individual files to the same output branch.
concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Read public language statistics and render SVG
        run: python3 .github/scripts/language_card.py "$GITHUB_REPOSITORY" dist/most-used-languages.svg
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the completed card
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: Update most used languages
        env:
          GITHUB_TOKEN: ${{ github.token }}
